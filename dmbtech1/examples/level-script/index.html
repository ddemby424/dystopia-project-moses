<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DMB Tech 1 — level script example</title>
  <!-- Peer dependency: Three.js r128, loaded as ES modules. Pin this version.
       "three/addons/" must have the trailing slash so loaders resolve correctly. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
    }
  }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #07090e; color: #e6ebf3;
      font-family: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
    #game { position: fixed; inset: 0; }
    .hud-note { position: fixed; left: 12px; bottom: 12px; z-index: 5;
      font-size: 13px; color: #8b95a8; background: rgba(0,0,0,.55);
      padding: 8px 10px; border-radius: 8px; pointer-events: none; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div class="hud-note">The map file has a script. This page also listens to the same events.</div>
  <script type="module">
    // The engine, plus the event names a level script can use.
    import { createEngine } from '../../dmbtech1.js';

    const engine = createEngine('#game', { assets: false });

    // Listen BEFORE loadMap so you do not miss the 'start' event.
    // You can also listen from the host page. Events:
    // start, tick (dt), kill (enemy type), pickup (item type),
    // door, use ({x,y}), exit.
    engine.on('start', () => {
      console.log('level started; script api is', engine.api);
    });
    engine.on('kill', (type) => {
      // type is the enemy kind, for example "grunt" or "drone".
      console.log('killed', type, 'left', engine.api && engine.api.enemiesLeft());
    });
    engine.on('exit', () => {
      console.log('player reached the exit pad');
    });

    // script-yard.retro already contains props.script, which uses the
    // level-script api: api.on, api.message, api.heal, api.enemiesLeft.
    // Those hooks live in the map so a designer can ship behavior with the file.
    await engine.loadMap('./script-yard.retro');

    engine.start();
  </script>
</body>
</html>
