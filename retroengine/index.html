<body>
<!-- SPLASH SCREEN v2 (fixed, id "boot" so it does not clash with the loading screen): stamped "DMB TECH 1" + credits + synthesized hammer sound -->
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet"> <!-- free military stencil font (SIL Open Font License) -->
<div id="boot">
  <h1>RETRO<span>ENGINE</span></h1>              <!-- main title, stays the biggest thing -->
  <div id="stamp"></div>                         <!-- empty box; the script stamps letters into it -->
  <div id="credits">                             <!-- hidden until the stamping finishes -->
    <p class="role">Darcy D. Demby</p>
    <p class="title">Chief Software Architect</p>
    <p class="co">DembySoftwareSystems</p>
    <p class="motto">Making cool tools with AI...</p>
  </div>
  <small id="prompt">TAP TO BOOT</small>         <!-- first tap = permission to play sound -->
</div>
<style>
  #boot { position: fixed; inset: 0; z-index: 99999; background: #000; /* full black cover above everything */
    display: flex; flex-direction: column; align-items: center; justify-content: center; /* center the stack */
    color: #ccc; font-family: monospace; text-align: center; transition: opacity .6s; }   /* fade-out speed */
  #boot h1 { font-size: 10.5vw; margin: 0; letter-spacing: 4px; }   /* title scales with screen width */
  #boot h1 span { color: #e33; }
  #stamp { font-family: 'Black Ops One', monospace;  /* stencil "TOP SECRET" letters */
    font-size: 7vw; color: #c22;                     /* smaller than the title but loud red */
    letter-spacing: 6px; min-height: 9vw;            /* reserve space so nothing jumps around */
    border: 3px solid transparent; padding: 0 12px; margin: 10px 0; }
  #stamp.done { border-color: #c22; transform: rotate(-3deg); } /* finished = boxed and tilted like an ink stamp */
  #stamp b { display: inline-block; animation: slam .18s ease-out; } /* each letter gets its own slam */
  @keyframes slam {                                  /* letter drops from huge and slams down to normal size */
    0%   { transform: scale(3); opacity: 0; }
    80%  { transform: scale(.9); opacity: 1; }      /* tiny squash on impact */
    100% { transform: scale(1); } }
  #credits { opacity: 0; transition: opacity .8s; }  /* invisible until shown */
  #credits.show { opacity: 1; }
  #credits p { margin: 4px; }
  .role { font-size: 5vw; color: #eee; }
  .title { font-size: 3.5vw; color: #999; letter-spacing: 2px; }
  .co { font-size: 4vw; color: #e33; margin-top: 14px !important; }
  .motto { font-size: 3vw; color: #777; font-style: italic; } /* smaller print */
  #prompt { margin-top: 30px; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #boot.hide { opacity: 0; pointer-events: none; }
</style>
<script>
(function () {
  var s = document.getElementById('boot'), stamp = document.getElementById('stamp');
  var credits = document.getElementById('credits'), prompt = document.getElementById('prompt');
  var TEXT = 'DMB TECH 1';                 // homage to id Tech 1
  var stage = 0, ac;                       // stage 0 = waiting, 1 = stamping, 2 = ready to close

  function hammer() {                      // builds a "THUD-clank" from scratch, like a TI-89 beep but fancier
    var t = ac.currentTime;                // the audio clock's "now"
    var o = ac.createOscillator(), g = ac.createGain(); // oscillator = tone maker, gain = volume knob
    o.frequency.setValueAtTime(150, t);    // start as a low boom...
    o.frequency.exponentialRampToValueAtTime(40, t + .15); // ...and drop in pitch = heavy impact
    g.gain.setValueAtTime(1, t);
    g.gain.exponentialRampToValueAtTime(.001, t + .2); // fast fade = short punchy hit
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .2); // wire to speakers, play 0.2 s
    var buf = ac.createBuffer(1, ac.sampleRate * .05, ac.sampleRate); // 0.05 s of blank audio
    var d = buf.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length); // fill with fading static = metal "clank"
    var n = ac.createBufferSource(), ng = ac.createGain(); ng.gain.value = .5;
    n.buffer = buf; n.connect(ng).connect(ac.destination); n.start(t);
  }

  function stampLetters(i) {               // stamps one letter, then calls itself for the next (a loop with pauses)
    if (i >= TEXT.length) {                // all letters done
      stamp.classList.add('done');         // box + tilt it like an ink stamp
      setTimeout(function () { credits.classList.add('show'); }, 300); // fade credits in
      prompt.textContent = 'TAP TO CONTINUE';
      stage = 2;
      setTimeout(close, 5000);             // auto-close 5 s later if nobody taps
      return;
    }
    var b = document.createElement('b');   // new element for this letter
    b.textContent = TEXT[i] === ' ' ? '\u00A0' : TEXT[i]; // a space would collapse, so use a non-breaking space
    stamp.appendChild(b);                  // adding it triggers the slam animation
    if (TEXT[i] !== ' ') hammer();         // no hammer on spaces
    setTimeout(function () { stampLetters(i + 1); }, TEXT[i] === ' ' ? 250 : 220); // wait, then next letter
  }

  function close() {
    if (s.classList.contains('hide')) return;
    s.classList.add('hide');
    setTimeout(function () { s.remove(); }, 700);
  }

  s.addEventListener('pointerdown', function () {
    if (stage === 0) {                     // first tap: start sound + stamping
      stage = 1; prompt.textContent = '';
      ac = new (window.AudioContext || window.webkitAudioContext)(); // webkit name = older iPhones
      stampLetters(0);
    } else if (stage === 2) close();       // tap after stamping = skip to the editor
  });
})();
</script>

  <!-- Top bar: project, level picker, undo/redo, play & export -->
  <header id="topbar">
    <div class="brand"><span class="logo">&#9670;</span><span class="txt">Retro<b>Engine</b></span><span class="ver">1.2.0</span></div>
    <button class="tb chip" id="btn-project" title="Projects: save / open"></button>
    <select id="level-select" title="Current level"></select>
    <div class="spacer"></div>
    <button class="tb" data-cmd="undo" title="Undo (Ctrl+Z)"><svg class="i"><use href="#i-undo"/></svg></button>
    <button class="tb" data-cmd="redo" title="Redo (Ctrl+Y)"><svg class="i"><use href="#i-redo"/></svg></button>
    <button class="tb sheet-only" data-cmd="explorer" title="Show explorer"><svg class="i"><use href="#i-folder"/></svg></button>
    <button class="tb sheet-only" data-cmd="sheet" title="Show panel"><svg class="i"><use href="#i-panel"/></svg></button>
    <button class="tb primary" data-cmd="play" title="Playtest (P)"><svg class="i"><use href="#i-play"/></svg><span class="lbl">Play</span></button>
    <button class="tb accent" data-cmd="export" title="Export standalone game"><svg class="i"><use href="#i-export"/></svg><span class="lbl lbl-md">Export</span></button>
    <button class="tb" data-cmd="menu" title="Menu"><svg class="i"><use href="#i-menu"/></svg></button>
  </header>

  <div id="main">
    <!-- Left explorer (project, levels, models, scripts). A sheet on phones. -->
    <aside id="explorer">
      <div class="ex-head">Explorer <button class="tb sm sheet-only" data-cmd="explorer" title="Close">✕</button></div>
      <div id="explorer-body"></div>
    </aside>
    <!-- Tool rail (filled by app.js) -->
    <nav id="toolbar"></nav>
    <!-- The 2D map -->
    <section id="stage">
      <canvas id="grid"></canvas>
      <div id="sel-bar" class="float hidden"></div>
      <div id="stamp-bar" class="float hidden"></div>
      <div id="map-readout" class="float">Cell -</div>
      <div id="hint" class="float"></div>
      <div id="zoom-dock" class="float">
        <button class="tb sm" data-cmd="zoomOut" title="Zoom out (-)"><svg class="i"><use href="#i-minus"/></svg></button>
        <span id="zoom-lbl">100%</span>
        <button class="tb sm" data-cmd="zoomIn" title="Zoom in (+)"><svg class="i"><use href="#i-plus"/></svg></button>
        <button class="tb sm" data-cmd="fit" title="Fit map (0)"><svg class="i"><use href="#i-fit"/></svg></button>
      </div>
    </section>
    <!-- Side panel / bottom sheet (filled by app.js) -->
    <aside id="panel">
      <div id="props-dock"></div>
      <div id="tabs">
        <button class="tab on" data-tab="build">Build</button>
        <button class="tab" data-tab="things">Things</button>
        <button class="tab" data-tab="templates">Rooms</button>
        <button class="tab" data-tab="level">Level</button>
        <button class="tab" data-tab="project">Project</button>
      </div>
      <div id="panel-body"></div>
    </aside>
  </div>
  <footer id="status"><span id="st-cell">Cell -</span><span id="st-tool"></span><span id="st-count"></span><span class="spacer"></span><span id="st-save"></span></footer>

  <div id="play-host"></div>
  <div id="mp-lobby-host"></div>
  <div id="toast-root"></div>
  <input type="file" id="file-json" accept=".json,application/json" hidden>
  <input type="file" id="file-retro" accept=".retro,.json,application/json,application/octet-stream,text/plain" hidden>
  <input type="file" id="file-glb" accept=".glb,.gltf,model/gltf-binary" hidden>
