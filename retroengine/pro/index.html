<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050607">
<meta name="robots" content="noindex">                      <!-- keep it out of search engines -->
<title>PRO — a RetroEngine campaign</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap">
<!-- Three.js r128 is DMB Tech 1's peer dependency (same pin as the editor). -->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/" } }
</script>
<link rel="stylesheet" href="pro.css">
</head>
<body>
<div id="game"></div>                                     <!-- DMB Tech 1 draws the levels in here -->
<div id="card" class="card">                              <!-- story cards sit on top of the game -->
  <div class="scan"></div>                                <!-- CRT scanlines, for grit -->
  <div class="inner">
    <div id="probox"><canvas id="pro3d"></canvas></div>   <!-- Pro turntable (intro + ending only); the box sets its size -->
    <div class="text">
      <div id="kicker" class="kicker"></div>
      <h1 id="ctitle"></h1>
      <div id="cbody" class="body"></div>
      <div id="cbtns" class="btns"></div>
    </div>
  </div>
</div>
<script type="module" src="pro.js"></script>
</body>
</html>
