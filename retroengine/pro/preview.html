<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">                <!-- keep it out of search engines -->
<title>Pro — suit preview</title>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/" } }
</script>
<style>
  html, body { margin: 0; height: 100%; background: radial-gradient(#1b1f24, #050607 70%); color: #c9d2da; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; }      /* dark steel backdrop */
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }  /* the 3D view fills the screen */
  #cap { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    text-align: center; background: linear-gradient(transparent, rgba(0,0,0,.75)); pointer-events: none; }
  h1 { margin: 0; font-size: 16px; letter-spacing: .2em; text-transform: uppercase; color: #e8eef3; }
  p { margin: 4px 0 0; font-size: 12px; opacity: .75; }
  #spin { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 12px; min-height: 44px; padding: 0 14px;
    background: rgba(10,14,18,.75); color: #d6e2ea; border: 1px solid #3a4652; border-radius: 4px; font-weight: 600; }
  #msg { position: fixed; top: 45%; width: 100%; text-align: center; font-size: 13px; letter-spacing: .1em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg">LOADING SGT. PROTAGONIST…</div>
<button id="spin">Spin: on</button>
<div id="cap">
  <h1>Sgt. Protagonist</h1>
  <p>Protag to the brass, Pro or Sgt Taggs to his squad. His own suit design, stolen by Pandemonium Inc. Drag to spin · pinch to zoom.</p>
  <p id="stats"></p>
</div>
<script type="module">
  import { mountPro } from './viewer.js?v=1.6.3';                // the shared turntable (1.6.1: cache-busted)
  const part = new URLSearchParams(location.search).get('part');  // ?part=cannon shows just his arm cannon (the in-game view model)
  const MODELS = { cannon: 'assets/pro_cannon.glb', enemy: 'assets/pro_enemy.glb', drone: 'assets/bot_drone.glb',
    minotaur: 'assets/pro_minotaur.glb', sentinel: 'assets/pro_sentinel.glb' };   // 1.6.0 Meshy drop-ins  // ?part=enemy = the red twin-cannon trooper
  const src = MODELS[part] || 'assets/pro_suit.glb';
  const v = mountPro(document.getElementById('c'), { controls: true, spin: 0.35, src });
  if (part === 'enemy') { document.querySelector('#cap h1').textContent = 'Pandemonium twin-cannon trooper';   // enemy caption
    document.querySelector('#cap p').textContent = "Built from Pro's stolen suit design: one cannon aims, the other fires down to keep it hovering."; }
  const CAPS = { minotaur: ['The Minotaur', "AntiLegend's Minotaur avatar, the Marble Shrine's final boss."],      // 1.6.0 captions
    sentinel: ['Ballisticus, the Living Armory', 'Bulletforge sentinel by Andfx (CC0, Meshy community). Pro uses it as the heavy warden.'] };
  if (CAPS[part]) { document.querySelector('#cap h1').textContent = CAPS[part][0]; document.querySelector('#cap p').textContent = CAPS[part][1]; }
  const msg = document.getElementById('msg'), btn = document.getElementById('spin');
  v.ready.then(ok => {                                          // hide the loading text, or explain a failure
    msg.textContent = ok ? '' : 'Could not load the suit model. Check your connection and reload.';
    if (ok) { let tris = 0; v.pivot.traverse(o => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
      document.getElementById('stats').textContent = tris.toLocaleString() + ' triangles · phone-friendly slim cut'; }
    window.PRO_PREVIEW_READY = ok;                              // test hook for the automated checks
  });
  let spinning = true;                                          // turntable starts on
  btn.onclick = () => { spinning = !spinning; v.setSpin(spinning ? 0.35 : 0);  // toggle it from the button
    btn.textContent = 'Spin: ' + (spinning ? 'on' : 'off'); };
</script>
</body>
</html>
